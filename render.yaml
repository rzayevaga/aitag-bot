services:
- type: web
  name: aitag-bot
  runtime: docker
  repo: https://github.com/rzayevaga/aitag-bot
  plan: free
  envVars:
  - key: BOT-TOKEN
    sync: false
  - key: API_ID
    sync: false
  - key: API_HASH
    sync: false
  region: frankfurt
  dockerContext: .
  dockerfilePath: ./Dockerfile
version: "1"
